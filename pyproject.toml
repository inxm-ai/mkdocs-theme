[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inxm-mkdocs-theme"
version = "0.1.0"
description = "MkDocs theme in the INXM design system: dark-canonical, hairlines only, one orange accent."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "INXM GmbH" }]
keywords = ["mkdocs", "theme", "documentation", "inxm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: MkDocs",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]
dependencies = ["mkdocs>=1.5"]

[project.urls]
Homepage = "https://inxm.ai"
Repository = "https://github.com/inxm-ai/mkdocs-theme"
Issues = "https://github.com/inxm-ai/mkdocs-theme/issues"

[project.entry-points."mkdocs.themes"]
inxm = "inxm_mkdocs_theme"

[project.optional-dependencies]
dev = ["pymdown-extensions", "pygments"]

[tool.hatch.build.targets.wheel]
packages = ["inxm_mkdocs_theme"]

[tool.hatch.build.targets.sdist]
include = ["inxm_mkdocs_theme", "README.md", "LICENSE", "pyproject.toml"]
